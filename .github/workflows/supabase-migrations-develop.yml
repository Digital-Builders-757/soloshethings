name: Supabase migrations (validate)

on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations-develop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations (no deploy)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Link project and validate migrations without deploy
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_ID }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --dry-run
          supabase db lint --linked --fail-on error
